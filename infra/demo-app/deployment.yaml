apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-api
  namespace: default
  labels:
    app: victim-api
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: victim-api
  template:
    metadata:
      labels:
        app: victim-api
        tier: backend
    spec:
      containers:
        - name: victim-api
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: victim-api
  namespace: default
  labels:
    app: victim-api
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: victim-api
