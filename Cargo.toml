[package]
name = "zervox"
version = "0.1.0"
edition = "2021"
description = "Single-binary process watchdog for Node and shell commands"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "serde"] }

[dev-dependencies]
tempfile = "3.10"
