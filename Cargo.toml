[package]
name = "zervox"
version = "0.1.0"
edition = "2021"
description = "Single-binary process watchdog for Node and shell commands"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
ctrlc = "3.4"
nix = { version = "0.29", features = ["signal", "process"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "local-offset", "macros", "serde"] }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
socketioxide = "0.18.3"
reqwest = { version = "0.13.4", features = ["json"] }
tower-http = { version = "0.6.11", features = ["fs"] }
regex = "1.12.3"

[dev-dependencies]
tempfile = "3.10"
