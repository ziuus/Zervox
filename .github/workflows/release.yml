name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64 release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package binary
        run: |
          mkdir -p dist
          cp target/release/zervox dist/zervox
          chmod +x dist/zervox
          tar -C dist -czf zervox-x86_64-unknown-linux-gnu.tar.gz zervox
          sha256sum zervox-x86_64-unknown-linux-gnu.tar.gz > zervox-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zervox-linux-x86_64
          path: |
            zervox-x86_64-unknown-linux-gnu.tar.gz
            zervox-x86_64-unknown-linux-gnu.tar.gz.sha256
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            zervox-x86_64-unknown-linux-gnu.tar.gz
            zervox-x86_64-unknown-linux-gnu.tar.gz.sha256
