version: '3.8'

# ============================================================
# Zervox Full Stack — Docker Compose
# Services: OPA · Zervox Primary · Zervox Backup · UI (Next.js)
# ============================================================

networks:
  zervox-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  zervox_data:       # Shared SQLite WAL volume (primary + backup)
  opa_bundles:       # OPA policy bundle storage

services:

  # ── Open Policy Agent ─────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: zervox-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-format=json"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ./zervox-core/policies:/policies:ro
    ports:
      - "8181:8181"
    networks:
      - zervox-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8181/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Zervox Primary Instance ───────────────────────────────
  zervox-primary:
    build:
      context: ./zervox-core
      dockerfile: Dockerfile
    container_name: zervox-primary
    environment:
      ZERVOX_ROLE: primary
      ZERVOX_HTTP_PORT: "8080"
      ZERVOX_HEARTBEAT_PORT: "9000"
      ZERVOX_API_KEY: "${ZERVOX_API_KEY:-zervox-secret-token}"
      ZERVOX_DB_PATH: /app/data/zervox.db
      OPA_URL: http://opa:8181/v1/data/zervox/authz
      ZERVOX_DRY_RUN: "${ZERVOX_DRY_RUN:-true}"
      ZERVOX_FORCE_FALLBACK: "${ZERVOX_FORCE_FALLBACK:-false}"
      # Optional LLM — set in .env or Compose override
      LLM_URL: "${LLM_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      RUST_LOG: "info,zervox_core=debug"
    volumes:
      - zervox_data:/app/data
    ports:
      - "8080:8080"
      - "9000:9000"
    networks:
      - zervox-net
    depends_on:
      opa:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── Zervox Backup Instance (HA Watchdog) ──────────────────
  zervox-backup:
    build:
      context: ./zervox-core
      dockerfile: Dockerfile
    container_name: zervox-backup
    environment:
      ZERVOX_ROLE: backup
      ZERVOX_HTTP_PORT: "8081"
      ZERVOX_HEARTBEAT_PORT: "9001"
      ZERVOX_PEER: "zervox-primary:9000"
      ZERVOX_API_KEY: "${ZERVOX_API_KEY:-zervox-secret-token}"
      ZERVOX_DB_PATH: /app/data/zervox.db
      OPA_URL: http://opa:8181/v1/data/zervox/authz
      ZERVOX_DRY_RUN: "${ZERVOX_DRY_RUN:-true}"
      ZERVOX_FORCE_FALLBACK: "${ZERVOX_FORCE_FALLBACK:-false}"
      LLM_URL: "${LLM_URL:-}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
      RUST_LOG: "info,zervox_core=debug"
    volumes:
      - zervox_data:/app/data
    ports:
      - "8081:8081"
      - "9001:9001"
    networks:
      - zervox-net
    depends_on:
      opa:
        condition: service_healthy
      zervox-primary:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  # ── Zervox UI (Next.js Dashboard) ────────────────────────
  zervox-ui:
    build:
      context: ./zervox-ui
      dockerfile: Dockerfile
      args:
        # These are baked into the JS bundle at build time
        NEXT_PUBLIC_PRIMARY_URL: "http://localhost:8080"
        NEXT_PUBLIC_BACKUP_URL: "http://localhost:8081"
        NEXT_PUBLIC_POLL_INTERVAL_MS: "3000"
    container_name: zervox-ui
    environment:
      # Server-side proxy targets (used by Next.js rewrites)
      ZERVOX_PRIMARY_URL: http://zervox-primary:8080
      ZERVOX_BACKUP_URL: http://zervox-backup:8081
      NODE_ENV: production
    ports:
      - "3000:3000"
    networks:
      - zervox-net
    depends_on:
      zervox-primary:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
