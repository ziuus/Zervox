version: '3.8'

services:
  zervox-primary:
    build:
      context: ./zervox-core
    environment:
      - ZERVOX_ROLE=primary
      - ZERVOX_HTTP_PORT=8080
      - ZERVOX_HEARTBEAT_PORT=9000
      - OPA_URL=http://opa:8181/v1/data/zervox/authz
      - RUST_LOG=info,zervox_core=debug
    ports:
      - "8080:8080"
      - "9000:9000"
    depends_on:
      - opa

  zervox-backup:
    build:
      context: ./zervox-core
    environment:
      - ZERVOX_ROLE=backup
      - ZERVOX_HTTP_PORT=8081
      - ZERVOX_HEARTBEAT_PORT=9001
      - ZERVOX_PEER=zervox-primary:9000
      - OPA_URL=http://opa:8181/v1/data/zervox/authz
      - RUST_LOG=info,zervox_core=debug
    ports:
      - "8081:8081"
    depends_on:
      - zervox-primary
      - opa

  frontend:
    image: node:20-alpine
    working_dir: /app
    # Uses a placeholder command if the Next.js frontend directory is empty, otherwise runs the dev server
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else echo 'Waiting for Next.js initialization...' && sleep infinity; fi"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"

  opa:
    image: openpolicyagent/opa:latest
    ports:
      - "8181:8181"
    volumes:
      - ./zervox-core/policies:/policies
    command:
      - "run"
      - "--server"
      - "--log-level=debug"
      - "/policies"
